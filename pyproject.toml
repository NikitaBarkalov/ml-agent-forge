[project]
name = "ml-agent-forge"
version = "0.1.0"
description = "Multi-agent ML & BA system for solving business tasks"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- LLM APIs ---
    "openai>=1.10.0",
    "anthropic>=0.25.0",
    "langchain-anthropic>=0.2.0",
    "langchain-core>=0.3.0",
    # --- Agent orchestration ---
    "langchain>=0.1.20",
    "langgraph>=0.0.45",
    # --- Code execution (E2B sandbox) ---
    "e2b-code-interpreter>=2.0.0",
    # --- Data profiling (DataDetective reads CSV/Excel locally) ---
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # --- Async / concurrency ---
    "anyio>=4.0.0",
    "tenacity>=8.2.0",
    # --- Config / env ---
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    # --- HTTP / tools ---
    "httpx>=0.26.0",
    # --- Logging / observability ---
    "structlog>=24.1.0",
    # --- Web server ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=14.0",
    "pypdf>=6.6.2",
]

[project.scripts]
ml-agent-forge = "src.ml_agent_forge.main:main"
ml-agent-forge-server = "src.ml_agent_forge.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.2.0",
]

[tool.uv]
package = true

# -------------------------
# 🧪 Pytest
# -------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# -------------------------
# 🧹 Ruff
# -------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# -------------------------
# 🖤 Black
# -------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# -------------------------
# 🔍 Mypy
# -------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = ["go-task-bin>=3.45.5"]

[tool.setuptools.packages.find]
where = ["src"]
