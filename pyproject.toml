[project]
name = "ml-agent-forge"
version = "0.1.0"
description = "Multi-agent ML & BA system for solving business tasks"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- LLM APIs ---
    "openai>=1.10.0",
    "anthropic>=0.25.0",

    # --- Agent orchestration ---
    "langchain>=0.1.20",
    "langgraph>=0.0.45",

    # --- Async / concurrency ---
    "anyio>=4.0.0",
    "tenacity>=8.2.0",

    # --- Config / env ---
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",

    # --- HTTP / tools ---
    "httpx>=0.26.0",

    # --- Logging / observability ---
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.2.0",
]

[tool.uv]
package = true

# -------------------------
# 🧪 Pytest
# -------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# -------------------------
# 🧹 Ruff
# -------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# -------------------------
# 🖤 Black
# -------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# -------------------------
# 🔍 Mypy
# -------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
